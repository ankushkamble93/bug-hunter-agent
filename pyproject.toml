[project]
name = "bug-hunter-agent"
version = "0.1.0"
description = "Localized Python micro-agent that hunts failing tests."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bug_hunter*", "sample_app*"]
